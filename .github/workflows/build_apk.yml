name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          cd mobile_app
          npm install

      - name: Clean & Prebuild Android Native
        run: |
          cd mobile_app
          rm -rf android ios .expo
          npx expo prebuild --platform android --clean

      - name: Create Missing Splash Resources Fix
        run: |
          cd mobile_app/android/app/src/main/res/values
          mkdir -p .
          echo '<resources><color name="splashscreen_background">#0f172a</color></resources>' > colors.xml

      - name: Build Android APK via Gradle
        run: |
          cd mobile_app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-option-apk
          path: mobile_app/android/app/build/outputs/apk/release/app-release.apk
