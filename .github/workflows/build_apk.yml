name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd mobile_app
          npm install

      - name: Build Android APK (EAS Local Build)
        run: |
          cd mobile_app
          npx eas-cli build --platform android --profile preview --local --output ./pocket-option.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-option-apk
          path: mobile_app/pocket-option.apk
