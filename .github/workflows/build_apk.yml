name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Locate Project Root & Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f "mobile_app/package.json" ]; then
            echo "PROJECT_DIR=mobile_app" >> $GITHUB_ENV
          else
            TARGET_DIR=$(dirname $(find . -maxdepth 3 -name "package.json" | head -n 1))
            echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV
          fi

      - name: Install Dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm install

      - name: Clean & Prebuild Native Android
        run: |
          cd ${{ env.PROJECT_DIR }}
          rm -rf android ios .expo
          npx expo prebuild --platform android --clean

      - name: Build Android APK via Gradle
        run: |
          cd ${{ env.PROJECT_DIR }}/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-option-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/app-release.apk
