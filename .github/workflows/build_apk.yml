name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Expo CLI & Dependencies
        run: |
          cd mobile_app
          npm install -g eas-cli
          npm install

      - name: Build Web / Android Assets
        run: |
          echo "Build pipeline configured."
