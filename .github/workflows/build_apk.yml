name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # V3 se V4 par update kiya

      - name: Set up Node.js
        uses: actions/setup-node@v4 # V3 se V4 par update kiya
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd mobile_app
          npm install
          
      - name: Export Web Bundle
        run: |
          cd mobile_app
          npx expo export --platform android
          
      # V4 syntax: Deprecation error ko fix karne ke liye
      - name: Upload Artifacts (App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: pocket-option-app-bundle
          path: mobile_app/dist/
